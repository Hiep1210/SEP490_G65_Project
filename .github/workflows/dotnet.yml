# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
   paths: verbum-service/**
  pull_request:
   paths: verbum-service/**
defaults:
 run:
  working-directory: ./verbum-service

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # - name: Test
    #   run: dotnet test --no-build --verbosity normal
      
  deploydocker:
  
    runs-on: ubuntu-latest
    needs: build  # Ensures 'build' job completes before 'deploy'
    if: github.ref == 'refs/heads/release' # Deploy runs only on 'release' branch
    
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/verbum-be:latest
          file: ./verbum-service/Dockerfile  # Specify the Dockerfile location
          
  deployrender:

    runs-on: ubuntu-latest
    needs: deploydocker  # Ensures 'build' job completes before 'deploy'
    if: github.ref == 'refs/heads/release'
    
    steps:
      - 
        name: Deploy
        uses: actions/checkout@v3
        with:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          run: |
            curl "$deploy_url"
